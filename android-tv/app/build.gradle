plugins { id 'com.android.application' }

android {
    namespace 'ge.kadri.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'ge.kadri.tv'
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName '1.0.9'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    testOptions { unitTests.all { systemProperty 'fixtureDir', rootProject.file('../tests/fixtures').absolutePath } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
    implementation 'org.jsoup:jsoup:1.21.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
